
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MULE Entertainment</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080e1d;color:white;font-family:Arial,sans-serif}
header{padding:20px;display:flex;justify-content:space-between;align-items:center;background:#101a30}
.logo{font-size:25px;font-weight:bold;color:#ffd34e}
.balance{background:#202d45;padding:10px;border-radius:12px;color:#ffd34e}
main{padding:16px}
.banner{background:linear-gradient(120deg,#263c65,#a97820);padding:25px;border-radius:16px;margin:12px 0 20px}
.banner h2{margin:0 0 8px}
.banner p{margin:0}
.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.shortcut{background:#17243b;padding:15px 4px;text-align:center;border-radius:12px;font-size:13px}
h3{margin-top:28px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{background:#17243b;border-radius:14px;padding:18px 12px;text-align:center}
.game .emoji{font-size:35px}
.game button{background:#ffd34e;border:0;border-radius:8px;padding:10px 20px;font-weight:bold}
.tag{color:#ffd34e;font-size:11px}
footer{position:fixed;bottom:0;left:0;right:0;background:#101a30;display:flex;justify-content:space-around;padding:16px}
footer span{font-size:13px}
main{padding-bottom:85px}
</style>
</head>
<body>
<header>
<div class="logo">MULE</div>
<div class="balance">⭐ 10,000 DEMO</div>
</header>
<main>
<div class="banner">
<h2>MULE መዝናኛ ክበብ</h2>
<p>PLAY & PRACTICE FOR FREE!</p>
</div>
<div class="shortcuts">
<div class="shortcut">🚀<br>Rocket</div>
<div class="shortcut">🏆<br>Contest</div>
<div class="shortcut">🎡<br>Spin</div>
<div class="shortcut">🎟️<br>Coupon</div>
</div><div class="game">
  <div class="emoji">🎱</div>
  <h4>Bingo</h4>
  <p class="tag">FREE GAME</p>
  <button onclick="location.href='bingo.html'">Play</button>
</div>
<h3>Featured Games</h3>
<div class="games">
<div class="game"><div class="emoji">✈️</div><h4>Aviator</h4><button onclick="play('Aviator')">Play</button></div>
<div class="game"><div class="emoji">🐔</div><h4>Chicken Road</h4><button onclick="play('Chicken Road')">Play</button></div>
<div class="game"><div class="emoji">🐓</div><h4>Chicken Roast</h4><p class="tag">NEW</p><button onclick="play('Chicken Roast')">Play</button></div>
<div class="game"><div class="emoji">🌌</div><h4>AviaMasters</h4><p class="tag">NEW</p><button onclick="play('AviaMasters')">Play</button></div>
<div class="game"><div class="emoji">💎</div><h4>Mine Gems</h4><button onclick="play('Mine Gems')">Play</button></div>
</div>
</main>
<footer><span>👥 Invite</span><span>🎮 Games</span><span>👤 Profile</span></footer>
<script>
function play(name){
alert(name+" selected! Free entertainment demo.");
}
</script>
</body>
</html>
