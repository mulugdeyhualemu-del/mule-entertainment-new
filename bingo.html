
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MULE Bingo</title>
<style>
body{background:#080e1d;color:white;font-family:Arial;text-align:center;padding:15px}
h1{color:#ffd34e}
#number{font-size:55px;color:#ffd34e;margin:20px}
table{margin:auto;border-collapse:collapse}
th,td{width:55px;height:55px;border:2px solid #ffd34e;font-size:20px}
th{color:#ffd34e}
td{background:#17243b;cursor:pointer}
td.marked{background:#c18c24;color:#080e1d}
button{background:#ffd34e;border:0;padding:14px 25px;border-radius:9px;font-weight:bold;margin:10px}
</style>
</head>
<body>
<h1>🎱 MULE BINGO</h1>
<p>FREE BINGO GAME</p>
<div id="number">READY?</div>
<button onclick="draw()">CALL NUMBER</button>
<button onclick="resetGame()">NEW GAME</button>
<table>
<thead><tr><th>B</th><th>I</th><th>N</th><th>G</th><th>O</th></tr></thead>
<tbody id="board"></tbody>
</table>
<p id="message">Tap a number to mark it.</p>
<script>
let numbers=[],called=[];
function makeBoard(){
numbers=[];called=[];
let ranges=[[1,15],[16,30],[31,45],[46,60],[61,75]];
for(let r=0;r<5;r++){
let row=[];
let pool=Array.from({length:15},(_,i)=>ranges[r][0]+i);
for(let c=0;c<5;c++){
let n=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
row.push(n);
}
numbers.push(row);
}
numbers[2][2]="FREE";
render();
}
function render(){
let html="";
for(let r=0;r<5;r++){
html+="<tr>";
for(let c=0;c<5;c++){
let n=numbers[r][c];
let marked=n==="FREE"||called.includes(n);
html+=`<td class="${marked?'marked':''}" onclick="mark(${r},${c})">${n}</td>`;
}
html+="</tr>";
}
document.getElementById("board").innerHTML=html;
}
function draw(){
let available=[];
for(let i=1;i<=75;i++)if(!called.includes(i))available.push(i);
if(!available.length){document.getElementById("number").textContent="ALL CALLED";return;}
let n=available[Math.floor(Math.random()*available.length)];
called.push(n);
let letter=n<=15?"B":n<=30?"I":n<=45?"N":n<=60?"G":"O";
document.getElementById("number").textContent=letter+"-"+n;
render();
}
function mark(r,c){
let n=numbers[r][c];
if(n!=="FREE"&&!called.includes(n)){
document.getElementById("message").textContent="Wait for that number to be called!";
return;
}
if(n==="FREE"||called.includes(n)){
render();
document.getElementById("message").textContent="Number marked!";
}
}
function resetGame(){
document.getElementById("number").textContent="READY?";
document.getElementById("message").textContent="New game started!";
makeBoard();
}
makeBoard();
</script>
</body>
</html>
